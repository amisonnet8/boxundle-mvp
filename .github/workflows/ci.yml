name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same checks before it builds a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: qsoku check
        shell: bash
        run: qsoku check

  # -race needs a C compiler, which windows-latest does not have.
  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: qsoku race
        shell: bash
        run: qsoku race

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: qsoku shellcheck
        run: qsoku shellcheck
      # The decision table of the hook that forces commands through bcuz (jq is on the runner).
      - name: qsoku hook
        run: qsoku hook

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
      - name: qsoku trivy
        run: qsoku trivy
